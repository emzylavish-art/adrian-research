name: Release gate

# A skipped smoke is not a release. Tag pushes fail closed until one live
# search and one live download both pass. This workflow does not deploy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  smoke-key:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          SOCIALFETCH_API_KEY: ${{ secrets.SOCIALFETCH_API_KEY }}
        run: |
          if [ -n "$SOCIALFETCH_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release smoke skipped until SOCIALFETCH_API_KEY exists."
          fi

  live-smoke:
    needs: smoke-key
    if: github.event_name == 'workflow_dispatch' && needs.smoke-key.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: One live search and one live download
        env:
          SOCIALFETCH_API_KEY: ${{ secrets.SOCIALFETCH_API_KEY }}
          SOCIAL_FETCH_DATA_DIR: ./mcp-data
          LIVE_DOWNLOAD_URL: https://www.youtube.com/watch?v=jNQXAC9IVRw
          LIVE_DOWNLOAD_TIMEOUT: "900"
        run: PYTHONPATH=. python scripts/release_gate.py --smoke

  block-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Block the tag unless both live proofs pass
        env:
          SOCIALFETCH_API_KEY: ${{ secrets.SOCIALFETCH_API_KEY }}
          SOCIAL_FETCH_DATA_DIR: ./mcp-data
          LIVE_DOWNLOAD_URL: https://www.youtube.com/watch?v=jNQXAC9IVRw
          LIVE_DOWNLOAD_TIMEOUT: "900"
        run: PYTHONPATH=. python scripts/release_gate.py --require
