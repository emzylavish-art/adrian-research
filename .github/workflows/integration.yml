name: Integration

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Live checks
        env:
          RUN_LIVE: "1"
          SOCIALFETCH_API_KEY: ${{ secrets.SOCIALFETCH_API_KEY }}
          EASYDOWN_API_KEY: ${{ secrets.EASYDOWN_API_KEY }}
          SOCIAL_FETCH_DATA_DIR: ./mcp-data
        run: PYTHONPATH=. python -m pytest -q
